name: Build and Deploy to ECS

on:
  push:
    branches: [dev, stage, main]
    paths:
      - 'src/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  SHARED_ACCOUNT_ID: "099576492599"
  PROJECT: online-boutique
  ECR_REGISTRY: 099576492599.dkr.ecr.us-east-1.amazonaws.com

jobs:
  # ===========================================================================
  # Determine which environment to deploy to based on branch
  # ===========================================================================
  setup:
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.env.outputs.environment }}
      account_id: ${{ steps.env.outputs.account_id }}
      cluster_name: ${{ steps.env.outputs.cluster_name }}
    steps:
      - name: Determine environment
        id: env
        run: |
          case "${GITHUB_REF##*/}" in
            dev)
              echo "environment=dev" >> $GITHUB_OUTPUT
              echo "account_id=723239944580" >> $GITHUB_OUTPUT
              echo "cluster_name=online-boutique-dev" >> $GITHUB_OUTPUT
              ;;
            stage)
              echo "environment=staging" >> $GITHUB_OUTPUT
              echo "account_id=716911968999" >> $GITHUB_OUTPUT
              echo "cluster_name=online-boutique-staging" >> $GITHUB_OUTPUT
              ;;
            main)
              echo "environment=prod" >> $GITHUB_OUTPUT
              echo "account_id=288280712573" >> $GITHUB_OUTPUT
              echo "cluster_name=online-boutique-prod" >> $GITHUB_OUTPUT
              ;;
          esac

  # ===========================================================================
  # Detect which services changed
  # ===========================================================================
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.filter.outputs.changes }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            frontend:              ['src/frontend/**']
            cartservice:           ['src/cartservice/**']
            productcatalogservice: ['src/productcatalogservice/**']
            currencyservice:       ['src/currencyservice/**']
            paymentservice:        ['src/paymentservice/**']
            shippingservice:       ['src/shippingservice/**']
            emailservice:          ['src/emailservice/**']
            checkoutservice:       ['src/checkoutservice/**']
            recommendationservice: ['src/recommendationservice/**']
            adservice:             ['src/adservice/**']
            loadgenerator:         ['src/loadgenerator/**']

  # ===========================================================================
  # Build & push changed images to shared ECR
  # ===========================================================================
  build-and-push:
    needs: [setup, detect-changes]
    if: needs.detect-changes.outputs.services != '[]'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: ${{ fromJson(needs.detect-changes.outputs.services) }}
      fail-fast: false
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (shared account)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ env.SHARED_ACCOUNT_ID }}:role/online-boutique-github-actions-deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Determine build context
        id: ctx
        run: |
          if [ "${{ matrix.service }}" = "cartservice" ]; then
            echo "context=src/cartservice/src" >> $GITHUB_OUTPUT
          else
            echo "context=src/${{ matrix.service }}" >> $GITHUB_OUTPUT
          fi

      - name: Build and push image
        run: |
          IMAGE_TAG="${{ github.sha }}"
          REPO="${{ env.ECR_REGISTRY }}/${{ env.PROJECT }}/${{ matrix.service }}"

          docker build -t $REPO:$IMAGE_TAG -t $REPO:latest -t $REPO:${{ needs.setup.outputs.environment }} ${{ steps.ctx.outputs.context }}
          docker push $REPO:$IMAGE_TAG
          docker push $REPO:latest
          docker push $REPO:${{ needs.setup.outputs.environment }}

  # ===========================================================================
  # Deploy to ECS in target account
  # ===========================================================================
  deploy:
    needs: [setup, detect-changes, build-and-push]
    if: needs.detect-changes.outputs.services != '[]'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: ${{ fromJson(needs.detect-changes.outputs.services) }}
      fail-fast: false
    steps:
      - name: Configure AWS credentials (shared account via OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ env.SHARED_ACCOUNT_ID }}:role/online-boutique-github-actions-deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Assume role in target environment account (role chaining)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ needs.setup.outputs.account_id }}:role/GitHubActions-Deploy-Role
          aws-region: ${{ env.AWS_REGION }}
          role-chaining: true
          role-skip-session-tagging: true

      - name: Force ECS service redeployment
        if: matrix.service != 'loadgenerator'
        run: |
          aws ecs update-service \
            --cluster ${{ needs.setup.outputs.cluster_name }} \
            --service ${{ needs.setup.outputs.cluster_name }}-${{ matrix.service }} \
            --force-new-deployment \
            --region ${{ env.AWS_REGION }}

      - name: Wait for service stability
        if: matrix.service != 'loadgenerator'
        run: |
          aws ecs wait services-stable \
            --cluster ${{ needs.setup.outputs.cluster_name }} \
            --services ${{ needs.setup.outputs.cluster_name }}-${{ matrix.service }} \
            --region ${{ env.AWS_REGION }}

  # ===========================================================================
  # Restart orchestrators last (refresh their gRPC connections to backends)
  # ===========================================================================
  refresh-orchestrators:
    needs: [setup, detect-changes, deploy]
    if: needs.detect-changes.outputs.services != '[]'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [checkoutservice, frontend]
      fail-fast: false
    steps:
      - name: Configure AWS credentials (shared account via OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ env.SHARED_ACCOUNT_ID }}:role/online-boutique-github-actions-deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Assume role in target environment account
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ needs.setup.outputs.account_id }}:role/GitHubActions-Deploy-Role
          aws-region: ${{ env.AWS_REGION }}
          role-chaining: true
          role-skip-session-tagging: true

      - name: Force restart of orchestrator service
        run: |
          echo "Restarting ${{ matrix.service }} to refresh gRPC connections to backends..."
          aws ecs update-service \
            --cluster ${{ needs.setup.outputs.cluster_name }} \
            --service ${{ needs.setup.outputs.cluster_name }}-${{ matrix.service }} \
            --force-new-deployment \
            --region ${{ env.AWS_REGION }}

      - name: Wait for orchestrator stability
        run: |
          aws ecs wait services-stable \
            --cluster ${{ needs.setup.outputs.cluster_name }} \
            --services ${{ needs.setup.outputs.cluster_name }}-${{ matrix.service }} \
            --region ${{ env.AWS_REGION }}

  # ===========================================================================
  # Final summary
  # ===========================================================================
  summary:
    needs: [setup, deploy, refresh-orchestrators]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Print summary
        run: |
          echo "Environment:    ${{ needs.setup.outputs.environment }}"
          echo "Account:        ${{ needs.setup.outputs.account_id }}"
          echo "Cluster:        ${{ needs.setup.outputs.cluster_name }}"
          echo "Deploy:         ${{ needs.deploy.result }}"
          echo "Orchestrators:  ${{ needs.refresh-orchestrators.result }}"
