global:
  scrape_interval: 30s
  evaluation_interval: 30s
  external_labels:
    monitor: 'online-boutique-observability'

scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Node Exporter — observability host metrics
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']

  # CloudWatch Exporter — AWS metrics from dev account
  - job_name: 'cloudwatch'
    scrape_interval: 60s
    scrape_timeout: 50s
    static_configs:
      - targets: ['cloudwatch-exporter:9106']
